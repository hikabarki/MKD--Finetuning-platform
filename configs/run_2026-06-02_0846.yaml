# =============================================================================
# Training recipe — generated by `ft configure` at 2026-06-02_0846 UTC
# Model:   Qwen/Qwen2.5-7B-Instruct
# Dataset: alpaca
# GPU:     NVIDIA GeForce RTX 5090 32 GB ×1
# =============================================================================

# --- Model -------------------------------------------------------------------
base_model: models/qwen__qwen2.5-7b-instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: false

# --- Dataset -----------------------------------------------------------------
datasets:
  - path: datasets/alpaca/train.jsonl
    type: chat_template
    field_messages: messages
    message_field_role: role
    message_field_content: content

chat_template: chatml
val_set_size: 0.01
sequence_len: 2048
sample_packing: false
pad_to_sequence_len: true

# --- Method ------------------------------------------------------------------
adapter: qlora
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# --- Optimizer & schedule ----------------------------------------------------
optimizer: adamw_torch
learning_rate: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8

# --- Run ---------------------------------------------------------------------
max_steps: 10
num_epochs: 1
micro_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
bf16: true
fp16: false
tf32: true
flash_attention: true

# --- Eval & checkpoint -------------------------------------------------------
eval_steps: 100
save_steps: 200
save_total_limit: 3
logging_steps: 10
output_dir: checkpoints/run_2026-06-02_0846

# --- Logging -----------------------------------------------------------------
wandb_project: ""
wandb_entity: ""
wandb_name: ""
wandb_log_model: "false"

# --- Stability ---------------------------------------------------------------
seed: 42
deterministic: false
loss_watchdog_threshold: 5.0
loss_watchdog_patience: 3
