# =============================================================================
# Default training recipe — generated by `ft configure`.
# Purpose:  QLoRA SFT of an 8B-class instruct model on a cleaned ChatML dataset.
# Hardware: single 80GB GPU (H100 / A100 / A6000 Ada)
# Expected runtime: ~3-6h for a 50k-row dataset, 3 epochs, seq=2048.
# Backend: Axolotl (see DECISIONS.md ADR-002).
# Refs:    01_scope.md, 02_architecture.md, 03_data.md
# =============================================================================

# --- Model -------------------------------------------------------------------
base_model: meta-llama/Llama-3.1-8B-Instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: false

# --- Dataset -----------------------------------------------------------------
# Path is set by `ft configure` from data_cards/<name>.json
datasets:
  - path: datasets/alpaca/train.jsonl
    type: chat_template
    field_messages: messages
    message_field_role: role
    message_field_content: content

chat_template: llama3            # MUST match base_model's actual template
val_set_size: 0.01               # already split in data, this is a safety net
sequence_len: 2048
sample_packing: false            # turn on once we trust loss-mask correctness
pad_to_sequence_len: true

# --- Method ------------------------------------------------------------------
adapter: qlora                   # see 02_architecture.md memory budget
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true

lora_r: 32
lora_alpha: 64                   # alpha = 2 * r is a sane LoRA default
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# --- Optimizer & schedule ----------------------------------------------------
optimizer: paged_adamw_8bit      # saves ~4GB on 8B; use adamw_torch for 4090
learning_rate: 2.0e-4            # LoRA tolerates 5-10× higher LR than full-FT
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.0                # LoRA-on-frozen-base doesn't need WD
max_grad_norm: 1.0
adam_beta1: 0.9
adam_beta2: 0.95                 # 0.95 is the LLM default (not 0.999)
adam_epsilon: 1.0e-8

# --- Run ---------------------------------------------------------------------
num_epochs: 3
micro_batch_size: 4              # 8 if 80GB, 1-2 if 24GB
gradient_accumulation_steps: 4   # target effective batch 16-64
gradient_checkpointing: true
bf16: true
fp16: false
tf32: true
flash_attention: true            # FlashAttention-2

# --- Eval & checkpoint -------------------------------------------------------
eval_steps: 100
save_steps: 200
save_total_limit: 3
logging_steps: 10
output_dir: checkpoints/run_PLACEHOLDER

# --- Logging -----------------------------------------------------------------
wandb_project: mkd-finetuning
wandb_entity: mkd-hika
wandb_name: PLACEHOLDER          # set by `ft configure` to {model}-{dataset}-{timestamp}
wandb_log_model: "false"

# --- Stability ---------------------------------------------------------------
seed: 42
deterministic: false             # true is 2-3× slower; only for debugging
loss_watchdog_threshold: 5.0     # abort if loss > 5x running median (set in code)
loss_watchdog_patience: 3        # consecutive bad steps before abort

# =============================================================================
# Abort criteria (enforced by scripts/ft_train.py, not by Axolotl):
#   - grad_norm > 10 for 5 consecutive steps   → abort
#   - loss is NaN                              → abort
#   - tok/s drops > 30% from minute-1 baseline → warn, continue
#   - MFU < 20% at step 50                     → warn, surface in logs
# =============================================================================
