[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ft-platform"
version = "1.0.0"
description = "Self-service fine-tuning platform for LLMs — MKD Co., Ltd."
readme = "README.md"
license = { text = "Internal — MKD Co., Ltd." }
authors = [{ name = "MKD AI Platform Team", email = "platform@mkd.kr" }]
requires-python = ">=3.10"

dependencies = [
    "huggingface_hub>=0.23",
    "datasets>=2.19",
    "transformers>=4.41",
    "accelerate>=0.30",
    "peft>=0.11",
    "trl>=0.8",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "datasketch>=1.6",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "redis>=5.0",
]
train = ["axolotl", "flash-attn"]
quant = ["autoawq"]
eval  = ["lm_eval>=0.4"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "black>=24.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
]

[project.scripts]
ft = "scripts.ft:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ft_platform*", "inference*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
skips = ["B101", "B603", "B607"]
