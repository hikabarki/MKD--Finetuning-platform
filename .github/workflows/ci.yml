name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev deps
        run: pip install black ruff mypy types-requests
      - name: black --check
        run: black --check --line-length=100 .
      - name: ruff
        run: ruff check . --select=E,W,F,I
      - name: mypy
        run: mypy api.py inference/ ft_platform/ --ignore-missing-imports --no-error-summary

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: bandit (high+medium only)
        run: |
          bandit -r api.py inference/ ft_platform/ ui/ vl_trainer.py \
            -ll -ii -f txt

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: pip install fastapi httpx pydantic pytest pytest-cov pytest-asyncio
      - name: pytest
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-fail-under=70
        env:
          FT_PROJECT: ${{ github.workspace }}
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
